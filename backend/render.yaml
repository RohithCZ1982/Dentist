services:
  - type: web
    name: dental-xray-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false        # you paste the value manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # paste your Vercel URL after deploying frontend
